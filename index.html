<!doctype html>
<!-- HTML = STRUCTURE. Two panes: a sidebar (controls + rooftop list) and a
     map. How it LOOKS lives in src/style.css; what it DOES lives in
     src/main.ts. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STÉGI — The Invisible City</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>STÉGI</h1>
        <p class="subtitle">Rooftop greening for a cooler Athens</p>
      </header>

      <div id="controls">
        <button id="draw">Draw area</button>
        <button id="detect" disabled>Detect rooftops</button>
        <button id="toggle-view" disabled>Show: After</button>
        <button id="clear" disabled>Clear</button>
      </div>

      <input id="search" type="search" placeholder="Filter: park / garden" disabled />
      <p id="hint">Drag a box across the map to pick your neighbourhood.</p>

      <div id="tally" hidden></div>
      <div id="detail" hidden></div>
      <ul id="rooftop-list"></ul>
    </aside>

    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
