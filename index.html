<!doctype html>

<!-- HTML = STRUCTURE. The sidebar contains location/boundary controls and the
     rooftop results; the map fills the remaining space. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STÉGI — The Invisible City</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <aside id="sidebar">
      <header>
        <h1>STÉGI</h1>
        <p class="subtitle">Rooftop greening for a cooler Athens</p>
      </header>

      <section class="panel" aria-labelledby="location-heading">
        <h2 id="location-heading">Find the site</h2>

        <form id="address-form" class="input-row">
          <label class="sr-only" for="address-search">Athens address</label>
          <input
            id="address-search"
            type="search"
            placeholder="Search an Athens address"
            autocomplete="street-address"
          />
          <button id="address-go" type="submit">Go</button>
        </form>

        <div class="upload-row">
          <input
            id="boundary-file"
            type="file"
            accept=".zip,.geojson,.json,application/zip,application/geo+json,application/json"
            hidden
          />
          <button id="upload-boundary" type="button">Upload boundary</button>
        </div>

        <p class="helper-text">
          Upload one polygon as GeoJSON, or a ZIP containing the SHP, SHX, DBF
          and PRJ files. Boundaries must be inside the Athens study area.
        </p>
      </section>

      <div id="controls">
        <button id="draw">Draw area</button>
        <button id="detect" disabled>Detect rooftops</button>
        <button id="toggle-view" disabled>Show: After</button>
        <button id="clear" disabled>Clear</button>
      </div>

      <input
        id="search"
        type="search"
        placeholder="Filter: park / garden"
        disabled
      />

      <p id="hint">Search for an address, upload a boundary, or draw an area.</p>

      <section class="panel log-panel" aria-labelledby="log-heading">
        <h2 id="log-heading">Project log</h2>
        <div id="activity-log" role="log" aria-live="polite"></div>
      </section>

      <div id="tally" hidden></div>
      <div id="detail" hidden></div>
      <ul id="rooftop-list"></ul>
    </aside>

    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
